name: "Restore Mtimes & Clean Lockfiles"
description: "Restores git file modification times and removes submodule mix.lock files to fix Elixir CI caching"

runs:
  using: "composite"
  steps:
    - name: Restore git mtimes and clean submodule lockfiles
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        find . -name mix.lock -not -path "./backend/mix.lock" -delete

        git log --format=%ct --name-only | perl -e '
          my $time; while (<>) { chomp; if (/^\d+$/) { $time = $_; next; } next if $_ eq "";
          next if !-e $_ || exists $seen{$_}; $seen{$_} = 1; utime($time, $time, $_); }
        '

        git submodule foreach --recursive '
          git log --format=%ct --name-only | perl -e '\''
            my $time; while (<>) { chomp; if (/^\d+$/) { $time = $_; next; } next if $_ eq "";
            next if !-e $_ || exists $seen{$_}; $seen{$_} = 1; utime($time, $time, $_); }
          '\''
        '
