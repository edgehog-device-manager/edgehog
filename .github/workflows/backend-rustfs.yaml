name: backend rustfs integration test
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: backend
env:
  MIX_ENV: test
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  integration-rustfs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Optimize Cache
        uses: ./.github/actions/restore-cache-mtimes

      - name: Start Rustfs
        run: |
          docker run -d \
            --name rustfs \
            -p 9000:9000 \
            -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin \
            -e RUSTFS_SECRET_KEY=rustfsadmin \
            -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs:1.0.0-alpha.83\
            /data

      - name: Wait for Rustfs to be ready
        run: |
          echo "Waiting for Rustfs to start..."
          for i in {1..30}; do
            if curl -s http://localhost:9000/ 2>/dev/null; then
              echo "Rustfs is ready!"
              break
            fi
            echo "Attempt $i/30: Rustfs not ready yet..."
            sleep 2
          done

      - name: Bucket setup
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://edgehog --region local 2>/dev/null || true
          aws --endpoint-url http://localhost:9000 s3api put-bucket-policy --bucket edgehog --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::edgehog/*"]}]}'
        env:
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          AWS_DEFAULT_REGION: local

      - uses: team-alembic/staple-actions/actions/mix-task@eb07547a6626ccf508fb4b293b821fde0253ed4f # main
        with:
          mix-env: test
          working-directory: backend
          task: test --only integration_storage
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          STORAGE_TYPE: s3
          S3_ACCESS_KEY_ID: rustfsadmin
          S3_SECRET_ACCESS_KEY: rustfsadmin
          S3_REGION: local
          S3_SCHEME: http://
          S3_HOST: localhost
          S3_PORT: 9000
          S3_BUCKET: edgehog
          S3_ASSET_HOST: http://localhost:9000/edgehog
