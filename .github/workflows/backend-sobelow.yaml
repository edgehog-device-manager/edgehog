name: backend sobelow
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: backend
env:
  MIX_ENV: test
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Optimize Cache
        uses: ./.github/actions/restore-cache-mtimes

      - uses: team-alembic/staple-actions/actions/mix-task@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          task: sobelow --config
          working-directory: backend
          mix-env: test
