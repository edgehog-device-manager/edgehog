name: License Header Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  license-check:
    name: Verify Copyright Headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Fetch base and head for comparison
          fetch-depth: 0
          token: ${{ github.token }}

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

      - name: Set up Python (for reuse tool)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"

      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "latest"

      - name: Install reuse tool
        run: uv tool install reuse

      - name: Make license script executable
        run: chmod +x ./tools/license.sh

      - name: Run license check
        run: |
          echo "🔍 Checking license headers for files changed in this PR..."
          ./tools/license.sh --check --base "${{ github.event.pull_request.base.sha }}"
