name: Edgehog docs generation

on:
  push:
    branches:
      - main
      - "release-*"
      - "!release-please*"
  pull_request:
    paths:
      - "backend/docs/**"
      - ".tool-versions"
      - ".github/workflows/docs-ci.yaml"
      - ".github/actions/doc-generate/**"
      - "tools/gen-docs-versions.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build docs from (e.g. main, release-0.14, v0.14.0). Defaults to `main`"
        required: false
        default: "main"
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  docs:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Determine docs version and publish
        id: docs-target
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" || "$ref" == "main" ]]; then
            version="snapshot"
          else
            version="$ref"
            version="${version#release-}"
            version="${version#v}"
            if [[ "$version" =~ ^([0-9]+\.[0-9]+) ]]; then
              version="${BASH_REMATCH[1]}"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          publish="false"
          if [[ "${{ github.repository_owner }}" == "edgehog-device-manager"
            && "${{ github.event_name }}" =~ ^(push|workflow_dispatch)$
            && "$version" =~ ^(snapshot|[0-9]+\.[0-9]+)$ ]]; then
            publish="true"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Checkout the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: edgehog
          show-progress: false
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}
      - name: Checkout the docs repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: edgehog-device-manager/docs
          path: docs
          show-progress: false
          fetch-depth: 1
      - name: Checkout the interfaces repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: edgehog-device-manager/edgehog-astarte-interfaces
          path: edgehog-astarte-interfaces
          show-progress: false
          fetch-depth: 1
      - name: Generate App token for docs push
        id: app-token
        if: ${{ steps.docs-target.outputs.publish == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.EDGEHOG_APP_APP_ID }}
          private-key: ${{ secrets.EDGEHOG_APP_PRIVATE_KEY }}
          owner: edgehog-device-manager
          repositories: docs
      - uses: ./edgehog/.github/actions/doc-generate
        with:
          edgehog: edgehog
          docs: docs
          astarte-interfaces: edgehog-astarte-interfaces
          version: ${{ steps.docs-target.outputs.version }}

      - name: Commit files
        if: ${{ steps.docs-target.outputs.publish == 'true' }}
        working-directory: docs
        run: |
          git config --local user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config --local user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git add .
          git diff --cached --quiet || git commit -m "Update Documentation"
      - name: Push changes
        if: ${{ steps.docs-target.outputs.publish == 'true' }}
        working-directory: docs
        run: |
          # Clear checkout extraheader/includeIf and staple global url rewrites that would shadow the App token
          git config --local --get-regexp 'includeIf' | cut -d' ' -f1 | while read -r key; do git config --local --unset "$key" || true; done
          git config --local --unset http.https://github.com/.extraheader || true
          git config --global --get-regexp 'url\.' | cut -d' ' -f1 | while read -r key; do git config --global --unset "$key" || true; done
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/edgehog-device-manager/docs.git
          git push origin main
